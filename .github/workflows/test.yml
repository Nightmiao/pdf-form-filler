name: 回归测试（双 Qt 环境）

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: form-filler

jobs:
  test-qt6:
    name: PySide6 (Qt6) / Python 3.12
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tests/smoke_test.py
      - run: python tests/audit_verify.py
      - run: python tests/regression_v106.py
      - run: python tests/print_accuracy.py
      - run: python tests/ui_layout_check.py

  test-qt5-win7-compat:
    name: PySide2 (Qt5) / Python 3.9 — Windows 7 兼容分支
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install -r requirements-win7.txt PyMuPDFb==1.23.22
      - run: python tests/smoke_test.py
      - run: python tests/audit_verify.py
      - run: python tests/regression_v106.py
      - run: python tests/print_accuracy.py
      - run: python tests/ui_layout_check.py
